<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የኮፒ ቤት እና ስቴሽነሪ መቆጣጠሪያ PWA</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --primary-color: #2563eb;
      --accent-color: #10b981;
      --danger-color: #ef4444;
      --border-color: #e5e7eb;
    }

    [data-theme="dark"] {
      --bg-color: #111827;
      --card-bg: #1f2937;
      --text-color: #f9fafb;
      --border-color: #374151;
    }

    * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; margin: 0; }
    
    .theme-toggle { background: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
    .card h3 { margin: 0; font-size: 0.85rem; opacity: 0.8; }
    .card p { margin: 8px 0 0; font-size: 1.2rem; font-weight: bold; color: var(--primary-color); }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

    .tab-content { display: none; background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
    .tab-content.active { display: block; }

    .form-group { display: flex; flex-direction: column; gap: 10px; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 1rem; background: var(--bg-color); color: var(--text-color); }
    button.submit-btn { background: var(--accent-color); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }

    .status-msg { margin-top: 10px; font-weight: bold; text-align: center; }
    
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); }
    .pay-btn { background: var(--primary-color); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .search-input { margin-bottom: 10px; width: 100%; }

    #qrContainer { text-align: center; margin-top: 10px; display: none; }
    #qrContainer img { width: 180px; height: 180px; border-radius: 8px; border: 2px solid var(--primary-color); }
    #reader { width: 100%; display: none; margin-bottom: 15px; }

    /* Modal / Receipt Box */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 10px; width: 90%; max-width: 380px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>የኮፒ ቤት መቆጣጠሪያ</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️ Mode</button>
  </header>

  <div class="dashboard-grid">
    <div class="card">
      <h3>የዛሬ ገቢ</h3>
      <p id="todayRevenue">0 ብር</p>
    </div>
    <div class="card">
      <h3>የዛሬ ወጪ</h3>
      <p id="todayExpense" style="color: var(--danger-color);">0 ብር</p>
    </div>
    <div class="card">
      <h3>ያልተከፈለ ዱቤ</h3>
      <p id="totalCredit" style="color: #f59e0b;">0 ብር</p>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('sales', event)">🛒 ሽያጭ/ወጪ</button>
    <button class="tab-btn" onclick="switchTab('calc', event)">🖩 የዋጋ ማሰቢያ</button>
    <button class="tab-btn" onclick="switchTab('orders', event)">📋 ትዕዛዞች</button>
    <button class="tab-btn" onclick="switchTab('credit', event)">📝 ዱቤ መዝገብ</button>
    <button class="tab-btn" onclick="switchTab('stock', event)">📦 የእቃ መቆጣጠሪያ</button>
  </div>

  <!-- 1. ሽያጭ እና ወጪ -->
  <div id="sales" class="tab-content active">
    <h3>አዲስ ሂሳብ መመዝገቢያ</h3>
    
    <button type="button" style="background: var(--primary-color); color: white; border: none; margin-bottom: 10px; cursor: pointer;" onclick="startScan('sales')">📷 ባርኮድ ስካን አድርግ</button>
    <div id="reader"></div>

    <div class="form-group">
      <label>የግብይት አይነት፡</label>
      <select id="salesType">
        <option value="copy">ኮፒ (ከፊት ብቻ / መንስኤ)</option>
        <option value="print">ፕሪንት (Print)</option>
        <option value="stationery">ስቴሽነሪ (እስክሪፕቶ/ደብተር/ጥራዝ...)</option>
        <option value="laminate">ላሚኔት (Laminate)</option>
        <option value="paper">ባዶ ወረቀት</option>
        <option value="expense">🔻 የቢሮ ወጪ</option>
      </select>
      <input type="text" id="salesDesc" placeholder="ዝርዝር ማብራሪያ (ለምሳሌ፡ 2 ጥራዝ)">
      <input type="number" id="salesAmount" placeholder="ጠቅላላ የሽያጭ ብር">
      <input type="number" id="salesCost" placeholder="የእቃው የመግዣ ዋጋ (ለትርፍ ስሌት)">
      <label>አስመዝጋቢ/ሰራተኛ፡</label>
      <select id="staffName">
        <option value="ባለቤት">ባለቤት</option>
        <option value="ሰራተኛ 1">ሰራተኛ 1</option>
        <option value="ሰራተኛ 2">ሰራተኛ 2</option>
      </select>
      <label>የክፍያ መንገድ፡</label>
      <select id="paymentMethod" onchange="toggleQR()">
        <option value="Cash">በካሽ (Cash)</option>
        <option value="Telebirr">ቴሌብር (Telebirr)</option>
        <option value="CBE">CBE Birr/Bank</option>
      </select>

      <div id="qrContainer">
        <p style="font-weight: bold; margin: 5px 0;">📲 ደንበኛው ስካን እንዲያደርግ ይህንን ያሳዩ፦</p>
        <img id="qrImage" src="" alt="QR Code">
      </div>

      <button type="button" class="submit-btn" onclick="submitSales()">መዝግብ እና ደረሰኝ አውጣ</button>
    </div>
    <div id="salesMsg" class="status-msg"></div>
  </div>

  <!-- 2. አውቶማቲክ የዋጋ ማሰቢያ -->
  <div id="calc" class="tab-content">
    <h3>የአገልግሎቶች አውቶማቲክ ማሰቢያ</h3>
    <div class="form-group" oninput="calculatePrice()">
      <label>የአገልግሎት አይነት፡</label>
      <select id="calcType">
        <option value="copy_single">ኮፒ (ከፊት ብቻ) - 4 ብር</option>
        <option value="copy_double">ኮፒ (ከፊትና ጀርባ/መንስኤ) - 8 ብር</option>
        <option value="print">ፕሪንት (Print) - 5 ብር</option>
        <option value="blank_paper">ባዶ ወረቀት - 2.50 ብር</option>
        <option value="binding">ጥራዝ (Binding) - 35 ብር</option>
        <option value="laminate">ላሚኔት - 15 ብር</option>
      </select>
      <label>ብዛት (የገጽ/የእቃ)፡</label>
      <input type="number" id="calcQty" placeholder="ምሳሌ፡ 10" value="1">
      <div style="margin-top: 15px; font-size: 1.2rem; font-weight: bold;">
        የተሰላ ጠቅላላ ዋጋ፡ <span id="calculatedPrice" style="color: var(--accent-color);">4 ብር</span>
      </div>
      <button type="button" class="submit-btn" onclick="transferCalcToSales()">ወደ ሽያጭ መዝገብ ላክ</button>
    </div>
  </div>

  <!-- 3. ትዕዛዞች (Orders) -->
  <div id="orders" class="tab-content">
    <h3>የህትመት እና የጥራዝ ትዕዛዞች መከታተያ</h3>
    <div class="form-group">
      <input type="text" id="orderCustomer" placeholder="የደንበኛ ስም">
      <input type="tel" id="orderPhone" placeholder="ስልክ ቁጥር">
      <input type="text" id="orderDetails" placeholder="የትዕዛዝ ዝርዝር (ለምሳሌ፡ 30 ገጽ ጥራዝ)">
      <input type="number" id="orderAmount" placeholder="የተስማሙበት ዋጋ (ብር)">
      <button type="button" class="submit-btn" onclick="submitOrder()">ትዕዛዝ መዝግብ</button>
    </div>
    <hr style="margin: 20px 0; border-color: var(--border-color);">
    <h3>በሂደት ላይ ያሉ ትዕዛዞች</h3>
    <div id="ordersList"></div>
  </div>

  <!-- 4. ዱቤ -->
  <div id="credit" class="tab-content">
    <h3>የዱቤ መከታተያ</h3>
    <div class="form-group">
      <input type="text" id="creditCustomer" placeholder="የደንበኛ ስም">
      <input type="tel" id="creditPhone" placeholder="ስልክ ቁጥር (ካለ)">
      <input type="number" id="creditAmount" placeholder="የዕዳ መጠን (ብር)">
      <button type="button" class="submit-btn" onclick="submitCredit()">ዱቤ መዝግብ</button>
    </div>
    <div id="creditMsg" class="status-msg"></div>
    <hr style="margin: 20px 0; border-color: var(--border-color);">
    <h3>ያልተከፈሉ ዱቤዎች</h3>
    <input type="text" class="search-input" id="searchCredit" placeholder="🔍 ደንበኛ ፈልግ..." oninput="filterCredits()">
    <div id="creditList"></div>
  </div>

  <!-- 5. ስቶክ -->
  <div id="stock" class="tab-content">
    <h3>የእቃ መጠን መቆጣጠሪያ</h3>
    
    <button type="button" style="background: var(--primary-color); color: white; border: none; margin-bottom: 10px; cursor: pointer;" onclick="startScan('stock')">📷 የእቃ ባርኮድ ስካን አድርግ</button>

    <div class="form-group">
      <input type="text" id="itemName" placeholder="የእቃ ስም">
      <input type="text" id="itemBarcode" placeholder="ባርኮድ (በካሜራ ወይም በፅሁፍ)">
      <input type="number" id="itemQty" placeholder="ያለው ብዛት">
      <input type="number" id="itemCostPrice" placeholder="የመግዣ ዋጋ (ብር)">
      <input type="number" id="itemSellPrice" placeholder="የመሸጫ ዋጋ (ብር)">
      <button type="button" class="submit-btn" onclick="submitStock()">እቃ መዝግብ/አድስ</button>
    </div>
    <div id="stockMsg" class="status-msg"></div>
    <hr style="margin: 20px 0; border-color: var(--border-color);">
    <h3>በስቶክ ያሉ እቃዎች</h3>
    <input type="text" class="search-input" id="searchStock" placeholder="🔍 እቃ ፈልግ..." oninput="filterStock()">
    <div id="stockList"></div>
  </div>

  <!-- ዲጂታል ደረሰኝ Pop-up Modal -->
  <div id="receiptModal" class="modal">
    <div class="modal-content">
      <h2 style="margin-top:0;">🧾 የክፍያ ደረሰኝ</h2>
      <hr style="border-color: var(--border-color);">
      <p id="receiptDetails" style="text-align: left; font-size: 0.95rem; line-height: 1.6;"></p>
      <button style="background: var(--accent-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;" onclick="closeReceipt()">ዝጋ (OK)</button>
    </div>
  </div>

  <script>
    // ⚠️ ከ Google Apps Script የተቀበሉትን አዲሱን Web App URL እዚህ ቦታ ይተኩ!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEBoCG1n3FYpzClt6hDD2IthVd4AgGXbXbIFo4WIk7a9H04WNljjkBytPBy2r1wYWC/exec";
    
    // ⚠️ የቴሌብር እና የባንክ ስልክ/ሂሳብ ቁጥርዎን እዚህ ይተኩ!
    const TELEBIRR_NO = "0904616146"; 
    const CBE_ACCOUNT = "1000000000000";

    let globalCredits = [];
    let globalStocks = [];
    let globalOrders = [];
    let html5QrcodeScanner = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    function playSuccessSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      if (current === 'dark') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'dark');
      }
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.target.classList.add('active');
      if(html5QrcodeScanner) {
        html5QrcodeScanner.clear();
        document.getElementById('reader').style.display = "none";
      }
    }

    function toggleQR() {
      const method = document.getElementById('paymentMethod').value;
      const container = document.getElementById('qrContainer');
      const img = document.getElementById('qrImage');

      if (method === 'Telebirr') {
        container.style.display = 'block';
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=tel:${TELEBIRR_NO}`;
      } else if (method === 'CBE') {
        container.style.display = 'block';
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${CBE_ACCOUNT}`;
      } else {
        container.style.display = 'none';
      }
    }

    function startScan(targetMode) {
      const readerElem = document.getElementById('reader');
      readerElem.style.display = "block";

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render((decodedText) => {
        html5QrcodeScanner.clear();
        readerElem.style.display = "none";
        playSuccessSound();

        if (targetMode === 'sales') {
          const matchedItem = globalStocks.find(s => s.barcode === decodedText);
          if (matchedItem) {
            document.getElementById('salesDesc').value = matchedItem.itemName;
            document.getElementById('salesAmount').value = matchedItem.sellPrice || 0;
            document.getElementById('salesCost').value = matchedItem.costPrice || 0;
            document.getElementById('salesType').value = 'stationery';
          } else {
            alert("ባርኮዱ ተነቧል ነገር ግን በስቶክ አልተገኘም፦ " + decodedText);
          }
        } else if (targetMode === 'stock') {
          document.getElementById('itemBarcode').value = decodedText;
        }
      });
    }

    function calculatePrice() {
      const qty = parseFloat(document.getElementById('calcQty').value) || 0;
      const type = document.getElementById('calcType').value;
      let unitPrice = 0;

      switch(type) {
        case 'copy_single': unitPrice = 4; break;
        case 'copy_double': unitPrice = 8; break;
        case 'print': unitPrice = 5; break;
        case 'blank_paper': unitPrice = 2.50; break;
        case 'binding': unitPrice = 35; break;
        case 'laminate': unitPrice = 15; break;
      }

      const total = qty * unitPrice;
      document.getElementById('calculatedPrice').innerText = total + " ብር (" + unitPrice + " ብር/አንድ)";
      return { total, type, qty };
    }

    function transferCalcToSales() {
      const calc = calculatePrice();
      document.getElementById('salesAmount').value = calc.total;
      document.getElementById('salesDesc').value = calc.qty + " ብዛት - " + document.getElementById('calcType').selectedOptions[0].text;
      switchTab('sales', { target: document.querySelectorAll('.tab-btn')[0] });
    }

    function fetchDashboard() {
      if(!SCRIPT_URL || SCRIPT_URL.includes("እዚህ_ላይ")) return;
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById('todayRevenue').innerText = (data.todayRevenue || 0) + " ብር";
          document.getElementById('todayExpense').innerText = (data.todayExpense || 0) + " ብር";
          document.getElementById('totalCredit').innerText = (data.totalCredit || 0) + " ብር";
          
          globalCredits = data.creditsList || [];
          globalStocks = data.stocksList || [];
          globalOrders = data.ordersList || [];
          renderCredits(globalCredits);
          renderStocks(globalStocks);
          renderOrders(globalOrders);
        })
        .catch(err => console.error(err));
    }

    function showReceipt(desc, amount, method, staff) {
      const date = new Date().toLocaleString();
      const details = `
        <strong>ቀን:</strong> ${date}<br>
        <strong>አገልግሎት/እቃ:</strong> ${desc}<br>
        <strong>ክፍያ መጠን:</strong> ${amount} ETB<br>
        <strong>የክፍያ መንገድ:</strong> ${method}<br>
        <strong>አስመዝጋቢ:</strong> ${staff}<br><br>
        <em>ስለጎበኙን እናመሰግናለን!</em>
      `;
      document.getElementById('receiptDetails').innerHTML = details;
      document.getElementById('receiptModal').style.display = 'flex';
    }

    function closeReceipt() {
      document.getElementById('receiptModal').style.display = 'none';
    }

    function renderOrders(list) {
      const container = document.getElementById('ordersList');
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = "<p>ምንም በሂደት ላይ ያለ ትዕዛዝ የለም!</p>";
        return;
      }
      list.forEach(item => {
        container.innerHTML += `
          <div class="list-item">
            <div>
              <strong>${item.customer}</strong> (${item.phone})<br>
              <small>${item.orderDesc} - ${item.amount} ብር</small><br>
              <span style="color: var(--primary-color); font-weight: bold;">ሁኔታ፦ ${item.status}</span>
            </div>
            <div>
              <button class="pay-btn" style="background:#f59e0b;" onclick="updateOrder('${item.customer}', 'ተጠናቋል')">ተጠናቋል</button>
              <button class="pay-btn" style="background:var(--accent-color);" onclick="updateOrder('${item.customer}', 'ተረክቧል')">ተረክቧል</button>
            </div>
          </div>
        `;
      });
    }

    function submitOrder() {
      const customer = document.getElementById('orderCustomer').value;
      const amount = document.getElementById('orderAmount').value;
      if (!customer || !amount) {
        alert("የደንበኛ ስም እና ዋጋ ያስገቡ!");
        return;
      }
      const payload = {
        action: "addOrder",
        customer: customer,
        phone: document.getElementById('orderPhone').value || "የለም",
        orderDesc: document.getElementById('orderDetails').value || "የለም",
        amount: amount
      };
      sendData(payload, null, () => {
        document.getElementById('orderCustomer').value = "";
        document.getElementById('orderPhone').value = "";
        document.getElementById('orderDetails').value = "";
        document.getElementById('orderAmount').value = "";
      });
    }

    function updateOrder(customer, newStatus) {
      sendData({ action: "updateOrderStatus", customer: customer, newStatus: newStatus });
    }

    function renderCredits(list) {
      const container = document.getElementById('creditList');
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = "<p>ምንም ያልተከፈለ ዱቤ የለም!</p>";
        return;
      }
      list.forEach(item => {
        container.innerHTML += `
          <div class="list-item">
            <div>
              <strong>${item.customer}</strong> (${item.phone})<br>
              <span style="color: #f59e0b; font-weight: bold;">${item.amount} ብር</span>
            </div>
            <button class="pay-btn" onclick="payCredit('${item.customer}', ${item.amount})">ተከፍሏል</button>
          </div>
        `;
      });
    }

    function filterCredits() {
      const q = document.getElementById('searchCredit').value.toLowerCase();
      const filtered = globalCredits.filter(c => c.customer.toLowerCase().includes(q) || c.phone.includes(q));
      renderCredits(filtered);
    }

    function renderStocks(list) {
      const container = document.getElementById('stockList');
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = "<p>ምንም የተመዘገበ እቃ የለም!</p>";
        return;
      }
      list.forEach(item => {
        const isLow = item.itemQty <= 5;
        container.innerHTML += `
          <div class="list-item">
            <div>
              <strong>${item.itemName}</strong> ${item.barcode ? `<small>(${item.barcode})</small>` : ''}<br>
              <small>መግዣ፡ ${item.costPrice || 0} ብር | መሸጫ፡ ${item.sellPrice || 0} ብር</small>
            </div>
            <div style="font-weight: bold; color: ${isLow ? 'var(--danger-color)' : 'var(--accent-color)'};">
              ${item.itemQty} ብዛት ${isLow ? '⚠️ (አነስተኛ)' : ''}
            </div>
          </div>
        `;
      });
    }

    function filterStock() {
      const q = document.getElementById('searchStock').value.toLowerCase();
      const filtered = globalStocks.filter(s => s.itemName.toLowerCase().includes(q) || (s.barcode && s.barcode.includes(q)));
      renderStocks(filtered);
    }

    function payCredit(customer, amount) {
      if(!confirm(`${customer} ${amount} ብር ከፈለ?`)) return;
      const msg = document.getElementById('creditMsg');
      sendData({ action: "payCredit", customer: customer, amount: amount }, msg);
    }

    function submitSales() {
      const msg = document.getElementById('salesMsg');
      const amount = document.getElementById('salesAmount').value;
      const desc = document.getElementById('salesDesc').value || "የለም";
      const method = document.getElementById('paymentMethod').value;
      const staff = document.getElementById('staffName').value;

      if (!amount) {
        msg.innerText = "⚠️ እባክዎን ብር ያስገቡ!";
        msg.style.color = "var(--danger-color)";
        return;
      }

      const payload = {
        action: "addSales",
        type: document.getElementById('salesType').value,
        desc: desc,
        amount: amount,
        cost: document.getElementById('salesCost').value || 0,
        paymentMethod: method,
        staff: staff
      };

      sendData(payload, msg, () => {
        showReceipt(desc, amount, method, staff);
        document.getElementById('salesDesc').value = "";
        document.getElementById('salesAmount').value = "";
        document.getElementById('salesCost').value = "";
      });
    }

    function submitCredit() {
      const msg = document.getElementById('creditMsg');
      const customer = document.getElementById('creditCustomer').value;
      const amount = document.getElementById('creditAmount').value;
      if (!customer || !amount) {
        msg.innerText = "⚠️ የስም እና የብር መጠን ያስገቡ!";
        msg.style.color = "var(--danger-color)";
        return;
      }
      const payload = {
        action: "addCredit",
        customer: customer,
        phone: document.getElementById('creditPhone').value || "የለም",
        amount: amount
      };
      sendData(payload, msg, () => {
        document.getElementById('creditCustomer').value = "";
        document.getElementById('creditPhone').value = "";
        document.getElementById('creditAmount').value = "";
      });
    }

    function submitStock() {
      const msg = document.getElementById('stockMsg');
      const name = document.getElementById('itemName').value;
      const qty = document.getElementById('itemQty').value;
      if (!name || !qty) {
        msg.innerText = "⚠️ የእቃ ስም እና ብዛት ያስገቡ!";
        msg.style.color = "var(--danger-color)";
        return;
      }
      const payload = {
        action: "updateStock",
        itemName: name,
        itemBarcode: document.getElementById('itemBarcode').value || "",
        itemQty: qty,
        costPrice: document.getElementById('itemCostPrice').value || 0,
        sellPrice: document.getElementById('itemSellPrice').value || 0
      };
      sendData(payload, msg, () => {
        document.getElementById('itemName').value = "";
        document.getElementById('itemBarcode').value = "";
        document.getElementById('itemQty').value = "";
        document.getElementById('itemCostPrice').value = "";
        document.getElementById('itemSellPrice').value = "";
      });
    }

    function sendData(payload, msgElement, resetForm) {
      if (msgElement) {
        msgElement.innerText = "⏳ በመመዝገብ ላይ...";
        msgElement.style.color = "var(--text-color)";
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        playSuccessSound();
        if (msgElement) {
          msgElement.innerText = "✅ መረጃው በትክክል ተመዝግቧል!";
          msgElement.style.color = "var(--accent-color)";
        }
        if (resetForm) resetForm();
        setTimeout(fetchDashboard, 2000);
      })
      .catch(err => {
        if (msgElement) {
          msgElement.innerText = "❌ ስህተት ተፈጥሯል!";
          msgElement.style.color = "var(--danger-color)";
        }
      });
    }

    fetchDashboard();
  </script>
</body>
</html>
