<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የኮፒ ቤት እና ስቴሽነሪ መቆጣጠሪያ PWA</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --primary-color: #2563eb;
      --accent-color: #10b981;
      --danger-color: #ef4444;
      --border-color: #e5e7eb;
    }

    [data-theme="dark"] {
      --bg-color: #111827;
      --card-bg: #1f2937;
      --text-color: #f9fafb;
      --border-color: #374151;
    }

    * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; margin: 0; }
    
    .theme-toggle { background: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
    .card h3 { margin: 0; font-size: 0.85rem; opacity: 0.8; }
    .card p { margin: 8px 0 0; font-size: 1.2rem; font-weight: bold; color: var(--primary-color); }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

    .tab-content { display: none; background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
    .tab-content.active { display: block; }

    .form-group { display: flex; flex-direction: column; gap: 10px; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 1rem; background: var(--bg-color); color: var(--text-color); }
    button.submit-btn { background: var(--accent-color); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }

    .status-msg { margin-top: 10px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>የኮፒ ቤት መቆጣጠሪያ</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️ Mode</button>
  </header>

  <div class="dashboard-grid">
    <div class="card">
      <h3>የዛሬ ገቢ</h3>
      <p id="todayRevenue">0 ብር</p>
    </div>
    <div class="card">
      <h3>የዛሬ ወጪ</h3>
      <p id="todayExpense" style="color: var(--danger-color);">0 ብር</p>
    </div>
    <div class="card">
      <h3>ያልተከፈለ ዱቤ</h3>
      <p id="totalCredit" style="color: #f59e0b;">0 ብር</p>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('sales', event)">🛒 ሽያጭ/ወጪ</button>
    <button class="tab-btn" onclick="switchTab('calc', event)">🖩 የኮፒ ማሰቢያ</button>
    <button class="tab-btn" onclick="switchTab('credit', event)">📝 ዱቤ መዝገብ</button>
    <button class="tab-btn" onclick="switchTab('stock', event)">📦 የእቃ መቆጣጠሪያ</button>
  </div>

  <div id="sales" class="tab-content active">
    <h3>አዲስ ሂሳብ መመዝገቢያ</h3>
    <div class="form-group">
      <label>የግብይት አይነት፡</label>
      <select id="salesType">
        <option value="service">አገልግሎት (ኮፒ/ህትመት...)</option>
        <option value="item">ስቴሽነሪ እቃ</option>
        <option value="expense">የቢሮ ወጪ</option>
      </select>
      <input type="text" id="salesDesc" placeholder="ዝርዝር ማብራሪያ (ካለ)">
      <input type="number" id="salesAmount" placeholder="ጠቅላላ ብር (ቁጥር ብቻ)">
      <select id="paymentMethod">
        <option value="Cash">በካሽ (Cash)</option>
        <option value="Telebirr">ቴሌብር (Telebirr)</option>
        <option value="CBE">CBE Birr/Bank</option>
      </select>
      <button type="button" class="submit-btn" onclick="submitSales()">መዝግብ</button>
    </div>
    <div id="salesMsg" class="status-msg"></div>
  </div>

  <div id="calc" class="tab-content">
    <h3>አውቶማቲክ የኮፒ/ህትመት ማሰቢያ</h3>
    <div class="form-group" oninput="calculateCopyPrice()">
      <label>የገጽ ብዛት፡</label>
      <input type="number" id="pageCount" placeholder="ምሳሌ፡ 50">
      <label>የአገልግሎት አይነት፡</label>
      <select id="copyType">
        <option value="black">ጥቁር እና ነጭ ኮፒ</option>
        <option value="black_double">ጥቁር እና ነጭ (መንስኤ)</option>
        <option value="color">ከለር ህትመት</option>
      </select>
      <div style="margin-top: 15px; font-size: 1.2rem; font-weight: bold;">
        የተሰላ ዋጋ፡ <span id="calculatedPrice" style="color: var(--accent-color);">0 ብር</span>
      </div>
    </div>
  </div>

  <div id="credit" class="tab-content">
    <h3>የዱቤ መከታተያ</h3>
    <div class="form-group">
      <input type="text" id="creditCustomer" placeholder="የደንበኛ ስም">
      <input type="tel" id="creditPhone" placeholder="ስልክ ቁጥር (ካለ)">
      <input type="number" id="creditAmount" placeholder="የዕዳ መጠን (ብር)">
      <button type="button" class="submit-btn" onclick="submitCredit()">ዱቤ መዝግብ</button>
    </div>
    <div id="creditMsg" class="status-msg"></div>
  </div>

  <div id="stock" class="tab-content">
    <h3>የእቃ መጠን መቆጣጠሪያ</h3>
    <div class="form-group">
      <input type="text" id="itemName" placeholder="የእቃ ስም">
      <input type="number" id="itemQty" placeholder="ያለው ብዛት">
      <button type="button" class="submit-btn" onclick="submitStock()">እቃ መዝግብ/አድስ</button>
    </div>
    <div id="stockMsg" class="status-msg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPGeYG-a7wbiFnU-2siaMIQs8RD5gKXkMZH5lrcpcJjCqVDXtJ_zDRY5ZlRZE0IC9-/exec";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      if (current === 'dark') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'dark');
      }
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.target.classList.add('active');
    }

    function calculateCopyPrice() {
      const pages = parseInt(document.getElementById('pageCount').value) || 0;
      const type = document.getElementById('copyType').value;
      let pricePerPage = 5;

      if (type === 'black') {
        pricePerPage = pages > 100 ? 3.5 : (pages > 20 ? 4 : 5);
      } else if (type === 'black_double') {
        pricePerPage = pages > 100 ? 5 : 6;
      } else if (type === 'color') {
        pricePerPage = pages > 20 ? 15 : 20;
      }

      const total = pages * pricePerPage;
      document.getElementById('calculatedPrice').innerText = total + " ብር (" + pricePerPage + " ብር/ገጽ)";
    }

    function fetchDashboard() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById('todayRevenue').innerText = (data.todayRevenue || 0) + " ብር";
          document.getElementById('todayExpense').innerText = (data.todayExpense || 0) + " ብር";
          document.getElementById('totalCredit').innerText = (data.totalCredit || 0) + " ብር";
        })
        .catch(err => console.error(err));
    }

    function submitSales() {
      const msg = document.getElementById('salesMsg');
      const amount = document.getElementById('salesAmount').value;
      
      if (!amount) {
        msg.innerText = "⚠️ እባክዎን ብር ያስገቡ!";
        msg.style.color = "var(--danger-color)";
        return;
      }

      msg.innerText = "በመመዝገብ ላይ...";
      msg.style.color = "var(--text-color)";

      const payload = {
        action: "addSales",
        type: document.getElementById('salesType').value,
        desc: document.getElementById('salesDesc').value || "የለም",
        amount: amount,
        paymentMethod: document.getElementById('paymentMethod').value
      };

      sendData(payload, msg, () => {
        document.getElementById('salesDesc').value = "";
        document.getElementById('salesAmount').value = "";
      });
    }

    function submitCredit() {
      const msg = document.getElementById('creditMsg');
      const customer = document.getElementById('creditCustomer').value;
      const amount = document.getElementById('creditAmount').value;

      if (!customer || !amount) {
        msg.innerText = "⚠️ የስም እና የብር መጠን ያስገቡ!";
        msg.style.color = "var(--danger-color)";
        return;
      }

      msg.innerText = "በመመዝገብ ላይ...";
      msg.style.color = "var(--text-color)";

      const payload = {
        action: "addCredit",
        customer: customer,
        phone: document.getElementById('creditPhone').value || "የለም",
        amount: amount
      };

      sendData(payload, msg, () => {
        document.getElementById('creditCustomer').value = "";
        document.getElementById('creditPhone').value = "";
        document.getElementById('creditAmount').value = "";
      });
    }

    function submitStock() {
      const msg = document.getElementById('stockMsg');
      const name = document.getElementById('itemName').value;
      const qty = document.getElementById('itemQty').value;

      if (!name || !qty) {
        msg.innerText = "⚠️ የእቃ ስም እና ብዛት ያስገቡ!";
        msg.style.color = "var(--danger-color)";
        return;
      }

      msg.innerText = "በመመዝገብ ላይ...";
      msg.style.color = "var(--text-color)";

      const payload = {
        action: "updateStock",
        itemName: name,
        itemQty: qty
      };

      sendData(payload, msg, () => {
        document.getElementById('itemName').value = "";
        document.getElementById('itemQty').value = "";
      });
    }

    function sendData(payload, msgElement, resetForm) {
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        const textMsg = data.message || "መረጃው በትክክል ተመዝግቧል!";
        msgElement.innerText = "✅ " + textMsg;
        msgElement.style.color = "var(--accent-color)";
        resetForm();
        fetchDashboard();
      })
      .catch(err => {
        msgElement.innerText = "❌ ስህተት ተፈጥሯል!";
        msgElement.style.color = "var(--danger-color)";
      });
    }

    fetchDashboard();
  </script>
</body>
</html>
