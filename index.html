<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የኮፒ ቤት እና ስቴሽነሪ መቆጣጠሪያ PWA</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --primary-color: #2563eb;
      --accent-color: #10b981;
      --danger-color: #ef4444;
      --border-color: #e5e7eb;
    }

    [data-theme="dark"] {
      --bg-color: #111827;
      --card-bg: #1f2937;
      --text-color: #f9fafb;
      --border-color: #374151;
    }

    * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; margin: 0; }
    
    .theme-toggle { background: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

    /* Dashboard Grid */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
    .card h3 { margin: 0; font-size: 0.9rem; opacity: 0.8; }
    .card p { margin: 8px 0 0; font-size: 1.3rem; font-weight: bold; color: var(--primary-color); }

    /* Navigation Tabs */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

    .tab-content { display: none; background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
    .tab-content.active { display: block; }

    form { display: flex; flex-direction: column; gap: 10px; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 1rem; background: var(--bg-color); color: var(--text-color); }
    button.submit-btn { background: var(--accent-color); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }

    .alert { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--danger-color); }
  </style>
</head>
<body>

  <header>
    <h1>የኮፒ ቤት ሂሳብ መቆጣጠሪያ</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️ Mode</button>
  </header>

  <!-- Dashboard Overview -->
  <div class="dashboard-grid">
    <div class="card">
      <h3>የዛሬ ገቢ</h3>
      <p id="todayRevenue">0 ብር</p>
    </div>
    <div class="card">
      <h3>የዛሬ ወጪ</h3>
      <p id="todayExpense" style="color: var(--danger-color);">0 ብር</p>
    </div>
    <div class="card">
      <h3>ያልተከፈለ ዱቤ</h3>
      <p id="totalCredit" style="color: #f59e0b;">0 ብር</p>
    </div>
  </div>

  <!-- Navigation -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('sales')">🛒 የሽያጭ ምዝገባ</button>
    <button class="tab-btn" onclick="switchTab('calc')">🖩 የኮፒ ማሰቢያ</button>
    <button class="tab-btn" onclick="switchTab('credit')">📝 የዱቤ መዝገብ</button>
    <button class="tab-btn" onclick="switchTab('stock')">📦 የእቃ መቆጣጠሪያ</button>
  </div>

  <!-- 1. Sales Tab -->
  <div id="sales" class="tab-content active">
    <h3>አዲስ ሂሳብ መመዝገቢያ</h3>
    <form id="salesForm">
      <label>የግብይት አይነት፡</label>
      <select id="salesType" onchange="toggleSalesInput()">
        <option value="service">አገልግሎት (ኮፒ/ህትመት/ላሚኔሽን...)</option>
        <option value="item">ስቴሽነሪ እቃ (ደብተር/እስክሪብቶ...)</option>
        <option value="expense">የቢሮ ወጪ</option>
      </select>
      <input type="text" id="salesDesc" placeholder="ዝርዝር ማብራሪያ" required>
      <input type="number" id="salesAmount" placeholder="ጠቅላላ ብር" required>
      <select id="paymentMethod">
        <option value="Cash">በካሽ (Cash)</option>
        <option value="Telebirr">ቴሌብር (Telebirr)</option>
        <option value="CBE">CBE Birr/Bank</option>
      </select>
      <button type="submit" class="submit-btn">መዝግብ</button>
    </form>
  </div>

  <!-- 2. Smart Copy Calculator Tab -->
  <div id="calc" class="tab-content">
    <h3>አውቶማቲክ የኮፒ/ህትመት ማሰቢያ</h3>
    <form oninput="calculateCopyPrice()">
      <label>የገጽ ብዛት፡</label>
      <input type="number" id="pageCount" placeholder="ምሳሌ፡ 50">
      <label>የአገልግሎት አይነት፡</label>
      <select id="copyType">
        <option value="black">ጥቁር እና ነጭ ኮፒ (Single)</option>
        <option value="black_double">ጥቁር እና ነጭ (መንስኤ/Double)</option>
        <option value="color">ከለር ህትመት</option>
      </select>
      <div style="margin-top: 15px; font-size: 1.2rem; font-weight: bold;">
        የተሰላ ዋጋ፡ <span id="calculatedPrice" style="color: var(--accent-color);">0 ብር</span>
      </div>
    </form>
  </div>

  <!-- 3. Credit Management Tab -->
  <div id="credit" class="tab-content">
    <h3>የዱቤ መከታተያ</h3>
    <form id="creditForm">
      <input type="text" id="creditCustomer" placeholder="የደንበኛ ስም" required>
      <input type="tel" id="creditPhone" placeholder="ስልክ ቁጥር">
      <input type="number" id="creditAmount" placeholder="የዕዳ መጠን (ብር)" required>
      <button type="submit" class="submit-btn">ዱቤ መዝግብ</button>
    </form>
  </div>

  <!-- 4. Stock Management Tab -->
  <div id="stock" class="tab-content">
    <h3>የእቃ መጠን መቆጣጠሪያ</h3>
    <div class="alert" id="stockAlert" style="display:none;">
      ⚠️ ትኩረት፡ አነስተኛ መጠን ያላቸው እቃዎች አሉ!
    </div>
    <form id="stockForm">
      <input type="text" id="itemName" placeholder="የእቃ ስም (ምሳሌ፡ A4 ወረቀት)" required>
      <input type="number" id="itemQty" placeholder="ያለው ብዛት" required>
      <button type="submit" class="submit-btn">እቃ መዝግብ/አድስ</button>
    </form>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Theme Toggle
    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      if (current === 'dark') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'dark');
      }
    }

    // Tab Switching
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // Smart Copy Calculator Logic
    function calculateCopyPrice() {
      const pages = parseInt(document.getElementById('pageCount').value) || 0;
      const type = document.getElementById('copyType').value;
      let pricePerPage = 5; // Default

      if (type === 'black') {
        pricePerPage = pages > 100 ? 3.5 : (pages > 20 ? 4 : 5);
      } else if (type === 'black_double') {
        pricePerPage = pages > 100 ? 5 : 6;
      } else if (type === 'color') {
        pricePerPage = pages > 20 ? 15 : 20;
      }

      const total = pages * pricePerPage;
      document.getElementById('calculatedPrice').innerText = total + " ብር (" + pricePerPage + " ብር/ገጽ)";
    }
  </script>
</body>
</html>
